org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Robolectric depends on AndroidX test artifacts; the app still uses platform widgets.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Bundled voice model: 2023, 2025, or baseline. CLI -PspeechModel overrides this.
speechModel=2023

# android6: API 23 compatible runtime; modern: API 24+ (new 32-bit TV).
speechRuntime=modern

# Standard app by default. Vendor platform-signing build: -PtvIntegration=stv
tvIntegration=standard
